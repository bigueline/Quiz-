<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link rel="stylesheet" href="./styles/quiz.css">
</head>
<body>
     <main class="quiz">
         <h1 class="quiz__title">Quiz</h1>
         <p class="quiz__intro">Teste seus conhecimentos com nosso quiz.</p>
     
      <button id="start" class="quiz__btn quiz__btn--primary" type="button">
         Iniciar Quiz
      </button>

    <form id="question-1" class="quiz__question quiz__question--hidden">
      <p class="quiz__question-number">Questão 1</p>
      <P class="quiz__question-text">Qual é a capital do Brasil?</P>
      <button class="quiz__option">
        <p class="quiz__option-text">São Paulo</p>
      </button>
      <button class="quiz__option">
        <p class="quiz__option-text">Rio de Janeiro</p>
      </button>
      <button class="quiz__option" data-correct>
        <p class="quiz__option-text">Brasília</p>
      </button>
      <button class="quiz__option">
        <p class="quiz__option-text">Belo Horizonte</p>
      </button>
    </form>

      <form id="question-2" class="quiz__question quiz__question--hidden">
        <p class="quiz__question-number">Questão 2</p>
        <P class="quiz__question-text">Qual é o menor estado do Brasil?</P>
       <button class="quiz__option">
         <p class="quiz__option-text">São Paulo</p>
       </button>
       <button class="quiz__option">
         <p class="quiz__option-text">Rio de Janeiro</p>
       </button>
       <button class="quiz__option" data-correct>
         <p class="quiz__option-text">Sergipe</p>
       </button>
       <button class="quiz__option">
         <p class="quiz__option-text">Belo Horizonte</p>
       </button>
      </form>

     <form id="question-3" class="quiz__question quiz__question--hidden">
       <p class="quiz__question-number">Questão 3</p>
       <P class="quiz__question-text">Qual é o maior estado do Brasil?</P>
       <button class="quiz__option">
         <p class="quiz__option-text">São Paulo</p>
       </button>
       <button class="quiz__option" data-correct>
         <p class="quiz__option-text">Amazonas</p>
       </button>
       <button class="quiz__option">
         <p class="quiz__option-text">Brasília</p>
       </button>
       <button class="quiz__option">
         <p class="quiz__option-text">Belo Horizonte</p>
       </button>
     </form>

     <div class="quiz__scoreboard quiz__scoreboard--hidden">
          <p class="quiz__score-label"> Pontuação: <span id="score" class="quiz__score-value">0</span></p>
     </div>

      <button class="quiz__btn quiz__btn--primary quiz__btn--hidden"  id="finish-quiz" type="button"
       >Finalizar Quiz
      </button>
        
    </main>
      <script src="./scripts/quiz.js" defer></script>
    </body>
</html>
